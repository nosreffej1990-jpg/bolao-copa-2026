<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação Taça - Bolão 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #051A10; /* Verde bem escuro baseado na imagem */
            background-image: radial-gradient(circle at center, #0A2E1C 0%, #051A10 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container da imagem da taça */
        .trophy-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .trophy-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Efeito de revelação de baixo para cima usando clip-path */
            animation: revealTrophy 3.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        /* Animação que faz a taça "surgir" magicamente */
        @keyframes revealTrophy {
            0% {
                clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
                opacity: 0;
                filter: brightness(3) blur(20px);
                transform: scale(0.9) translateY(50px);
            }
            50% {
                opacity: 0.8;
                filter: brightness(1.5) blur(5px);
            }
            100% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                opacity: 1;
                filter: brightness(1) blur(0);
                transform: scale(1) translateY(0);
            }
        }

        /* Partículas douradas flutuantes (JavaScript vai gerá-las) */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00;
            animation: floatUp infinite ease-in;
            opacity: 0;
        }

        /* Animação do voo das partículas */
        @keyframes floatUp {
            0% {
                transform: translateY(50px) translateX(0) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-300px) translateX(var(--drift)) scale(1.5);
                opacity: 0;
            }
        }

        /* Card Glassmorphism (Textos) */
        .glass-card {
            position: absolute;
            bottom: 8%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 24px 60px;
            text-align: center;
            color: #fff;
            z-index: 3;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            /* Só aparece depois que a taça começa a se formar */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.5s 2.5s forwards ease-out;
        }

        .glass-card p {
            margin: 0;
            font-size: 11px;
            color: #a8a8b3;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 215, 0, 0.1);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        .glass-card h1 {
            margin: 10px 0 0 0;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #FFFFFF 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: serif; /* Dá um tom mais clássico/épico */
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <!-- Container das partículas mágicas -->
    <div class="particles" id="particles"></div>

    <!-- Container da Taça -->
    <div class="trophy-container">
        <!-- 
          INSTRUÇÃO: Salve a imagem que você mandou na mesma pasta deste arquivo
          com o nome "imagem_taca.jpg" (ou altere o src abaixo) 
        -->
        <img src="imagem_taca.jpg.png" alt="Taça da Copa" class="trophy-image" id="taca" onerror="this.src='https://via.placeholder.com/400x500/051A10/ffd700?text=Coloque+a+Imagem+Aqui'">
    </div>

    <!-- Painel de Carregamento -->
    <div class="glass-card">
        <p>Carregando...</p>
        <div class="spinner"></div>
        <h1>BOLÃO<br>COPA 2026</h1>
    </div>

    <script>
        // Script para gerar as partículas douradas dinamicamente
        const particlesContainer = document.getElementById('particles');
        const colors = ['#ffd700', '#ffaa00', '#ffeb73', '#ffffff'];

        // Quantidade de partículas
        const particleCount = 100;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Tamanhos variados (algumas maiores, outras parecendo poeira)
            const size = Math.random() * 4 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Posiciona as partículas focadas no centro (onde a taça está)
            const left = 35 + Math.random() * 30; // Concentra entre 35% e 65% da tela
            particle.style.left = `${left}%`;
            
            // Inicia do meio para baixo
            particle.style.top = `${40 + Math.random() * 60}%`;
            
            // Animação variada para parecer natural
            particle.style.animationDelay = `${Math.random() * 3}s`;
            particle.style.animationDuration = `${1.5 + Math.random() * 2.5}s`;
            
            // Movimento lateral aleatório
            const drift = (Math.random() - 0.5) * 150; // drift entre -75px e 75px
            particle.style.setProperty('--drift', `${drift}px`);
            
            // Cor (maioria dourada)
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
